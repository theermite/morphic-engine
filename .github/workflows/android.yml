name: android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The wrapper jar is gitignored (generated, not committed). Generate it
      # here so ./gradlew is available, pinned to the catalogued Gradle version.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.1.0

      - name: Android lint
        run: ./gradlew :morphic:lint --stacktrace

      - name: Unit tests
        run: ./gradlew :morphic:testDebugUnitTest --stacktrace

      - name: Coverage report (Kover)
        run: ./gradlew :morphic:koverXmlReport :morphic:koverHtmlReport --stacktrace

      # Surface coverage as a downloadable artifact so the Critical 95% floor on
      # the onboarding logic (A-5) is auditable per run (PET-Android §8 décision
      # #4, option A). Kover 0.9.x cannot express a per-package verify gate, so
      # the number is read, not enforced — for now.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-coverage-report
          path: android/morphic/build/reports/kover/
          if-no-files-found: error
