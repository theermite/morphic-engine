name: android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The wrapper jar is gitignored (generated, not committed). Generate it
      # here so ./gradlew is available, pinned to the catalogued Gradle version.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.1.0

      - name: Android lint
        run: ./gradlew :morphic:lint --stacktrace

      - name: Unit tests
        run: ./gradlew :morphic:testDebugUnitTest --stacktrace

      - name: Coverage report (Kover)
        run: ./gradlew :morphic:koverXmlReport --stacktrace

      # Enforce the floors (Sensitive 90% module, Critical 95% onboarding logic).
      # Fails the build below threshold — coverage becomes a gate, not a claim.
      - name: Coverage verify (Kover)
        run: ./gradlew :morphic:koverVerify --stacktrace
