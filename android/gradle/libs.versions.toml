# Version catalog — single source of truth for the Android subtree.
# Verified 2026-06-13 (veille): AGP 9.0.1, Gradle 9.1.0, Kover 0.9.8.
# AGP 9 ships built-in Kotlin support, so no separate Kotlin plugin is applied
# here. Explicit Kotlin/Compose version pinning is deferred to A-4 (Compose),
# the first brick that needs the Compose compiler. See docs/PET-Android.md.
[versions]
agp = "9.0.1"
kover = "0.9.8"
junit = "4.13.2"
# DataStore (A-3 persistence). 1.2.1 stable, verified 2026-06-14 (developer.android.com
# + dl.google.com POM). Pulls kotlinx-coroutines-core 1.9.0 transitively; coroutines-test
# is pinned to that same 1.9.0 below to avoid version skew.
datastore = "1.2.1"
coroutines = "1.9.0"
compileSdk = "35"
minSdk = "24"

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
