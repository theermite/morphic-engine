[package]
name = "morphic-wasm-core"
version = "2.0.0-alpha.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Shinkofa Morphic Adaptation — Rust→WASM critical paths (NaCl box, B-018)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
crypto_box = "0.9"
rand_core = { version = "0.6", features = ["getrandom"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
proptest = "1.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Disable wasm-opt (bundled version too old, doesn't support bulk-memory
# operations that rustc emits by default since 1.82). All modern browsers
# (Chrome >=75, Firefox >=79, Safari >=15) support bulk-memory natively.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
